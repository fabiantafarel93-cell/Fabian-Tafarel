<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>

<body class="bg-light">

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-7">

            <div class="card shadow border-0">
                <div class="card-header bg-primary text-white text-center p-3">
                    <h3 class="mb-0">Kalkulator Sistem Bilangan</h3>
                </div>

                <div class="card-body p-4">

                    <!-- Input Bilangan -->
                    <div class="mb-3">
                        <label for="bilangan" class="form-label fw-bold">
                            Masukkan Bilangan
                        </label>
                        <input
                            type="text"
                            id="bilangan"
                            class="form-control form-control-lg"
                            placeholder="Contoh: 1010"
                        >
                    </div>

                    <!-- Sistem Bilangan Asal -->
                    <div class="mb-3">
                        <label for="asal" class="form-label fw-bold">
                            Sistem Bilangan Asal
                        </label>
                        <select id="asal" class="form-select form-select-lg">
                            <option value="2">Biner (Basis 2)</option>
                            <option value="8">Oktal (Basis 8)</option>
                            <option value="10" selected>Desimal (Basis 10)</option>
                            <option value="16">Heksadesimal (Basis 16)</option>
                        </select>
                    </div>

                    <!-- Sistem Bilangan Tujuan -->
                    <div class="mb-4">
                        <label for="tujuan" class="form-label fw-bold">
                            Sistem Bilangan Hasil
                        </label>
                        <select id="tujuan" class="form-select form-select-lg">
                            <option value="2">Biner (Basis 2)</option>
                            <option value="8">Oktal (Basis 8)</option>
                            <option value="10">Desimal (Basis 10)</option>
                            <option value="16" selected>
                                Heksadesimal (Basis 16)
                            </option>
                        </select>
                    </div>

                    <!-- Tombol Konversi -->
                    <button
                        type="button"
                        class="btn btn-primary btn-lg w-100"
                        onclick="konversikan()"
                    >
                        Konversi
                    </button>

            <p class="text-center text-muted mt-3">
                Kalkulator Konversi Sistem Bilangan
            </p>

        </div>
    </div>
</div>

<script>
    function konversikan() {
        const input = document.getElementById("bilangan")
            .value.trim();

        const asal = Number(document.getElementById("asal").value);
        const tujuan = Number(document.getElementById("tujuan").value);

        const nilaiAsal = document.getElementById("nilaiAsal");
        const basisAsal = document.getElementById("basisAsal");
        const nilaiHasil = document.getElementById("nilaiHasil");
        const basisHasil = document.getElementById("basisHasil");
        const nilaiDesimal = document.getElementById("nilaiDesimal");
        const pesan = document.getElementById("pesan");

        // Reset pesan
        pesan.textContent = "";
        pesan.className = "text-center fw-bold mt-3";

        // Validasi input kosong
        if (input === "") {
            tampilkanError("Silakan masukkan bilangan terlebih dahulu.");
            return;
        }

        // Pola validasi berdasarkan basis
        const pola = {
            2: /^[01]+$/,
            8: /^[0-7]+$/,
            10: /^[0-9]+$/,
            16: /^[0-9a-fA-F]+$/
        };

        if (!pola[asal].test(input)) {
            tampilkanError(
                "Bilangan tidak valid untuk sistem bilangan basis " + asal + "."
            );
            return;
        }

        // Konversi ke bilangan desimal
        const desimal = parseInt(input, asal);

        // Validasi batas integer aman JavaScript
        if (!Number.isSafeInteger(desimal)) {
            tampilkanError(
                "Bilangan terlalu besar. Silakan masukkan bilangan yang lebih kecil."
            );
            return;
        }

        // Konversi ke basis tujuan
        const hasil = desimal.toString(tujuan).toUpperCase();

        // Menampilkan tabel hasil
        nilaiAsal.textContent = input.toUpperCase();
        basisAsal.textContent = asal;
        nilaiHasil.textContent = hasil;
        basisHasil.textContent = tujuan;
        nilaiDesimal.textContent = desimal.toString();

        pesan.textContent = "Konversi berhasil!";
        pesan.classList.add("text-success");
    }

    function tampilkanError(teks) {
        document.getElementById("pesan").textContent = teks;
        document.getElementById("pesan").className =
            "text-center fw-bold mt-3 text-danger";

        document.getElementById("nilaiAsal").textContent = "-";
        document.getElementById("basisAsal").textContent = "-";
        document.getElementById("nilaiHasil").textContent = "-";
        document.getElementById("basisHasil").textContent = "-";
        document.getElementById("nilaiDesimal").textContent = "-";
    }
</script>

</body>
</html>
