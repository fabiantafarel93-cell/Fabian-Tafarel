<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow p-4 mx-auto" style="max-width: 600px;">

            <h2 class="text-center mb-4">Kalkulator Sistem Bilangan</h2>

            <!-- Input -->
            <div class="mb-3">
                <label class="form-label">Masukkan Bilangan</label>
                <input type="text" id="angka" class="form-control" placeholder="Contoh: 1010">
            </div>

            <!-- Sistem bilangan input -->
            <div class="mb-3">
                <label class="form-label">Sistem Bilangan Input</label>
                <select id="sistemInput" class="form-select">
                    <option value="2">Biner</option>
                    <option value="8">Oktal</option>
                    <option value="10" selected>Desimal</option>
                    <option value="16">Hexadesimal</option>
                </select>
            </div>

            <!-- Sistem bilangan hasil -->
            <div class="mb-3">
                <label class="form-label">Sistem Bilangan Hasil</label>
                <select id="sistemHasil" class="form-select">
                    <option value="2">Biner</option>
                    <option value="8">Oktal</option>
                    <option value="10" selected>Desimal</option>
                    <option value="16">Hexadesimal</option>
                </select>
            </div>

            <!-- Tombol -->
            <button onclick="konversikan()" class="btn btn-primary w-100">
                Konversi
            </button>

            <!-- Hasil -->
            <div class="text-center mt-4">
                <label class="form-label">Hasil</label>
                <div id="hasil" class="fs-1 fw-bold text-primary">
                    -
                </div>
            </div>

        </div>
    </div>

    <script>
        function konversikan() {

            let angka = document.getElementById("angka").value.trim();
            let sistemInput = parseInt(document.getElementById("sistemInput").value);
            let sistemHasil = parseInt(document.getElementById("sistemHasil").value);
            let hasil = document.getElementById("hasil");

            if (angka === "") {
                hasil.innerHTML = "Masukkan angka!";
                return;
            }

            // Ubah input ke desimal
            let desimal = parseInt(angka, sistemInput);

            // Validasi angka
            if (isNaN(desimal)) {
                hasil.innerHTML = "Input tidak valid!";
                return;
            }

            // Konversi desimal ke sistem tujuan
            let konversi = desimal.toString(sistemHasil).toUpperCase();

            hasil.innerHTML = konversi;
        }
    </script>

</body>
</html>
