<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Kalkulator Sistem Bilangan</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f4f6f9;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 650px;
        }

        .card {
            border: none;
            border-radius: 12px;
            overflow: hidden;
        }

        .judul {
            background: #0d6efd;
            color: white;
            padding: 25px 15px;
            text-align: center;
        }

        .judul h2 {
            margin: 0;
            font-weight: bold;
        }

        .hasil-box {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 20px;
        }

        #hasil {
            font-size: 45px;
            font-weight: bold;
            color: #198754;
            word-break: break-all;
        }

        #infoHasil {
            font-size: 18px;
            color: #6c757d;
        }
    </style>
</head>

<body>

<div class="container mt-5 mb-5">

    <div class="card shadow">

        <!-- Judul -->
        <div class="judul">
            <h2>Kalkulator Sistem Bilangan</h2>
        </div>

        <div class="card-body p-4">

            <!-- Input -->
            <div class="mb-4">
                <label for="angka" class="form-label fw-bold">
                    Masukkan Bilangan
                </label>

                <input
                    type="text"
                    id="angka"
                    class="form-control form-control-lg"
                    placeholder="Contoh: 1010"
                >
            </div>

            <!-- Sistem Bilangan Asal -->
            <div class="mb-4">
                <label for="sistemInput" class="form-label fw-bold">
                    Sistem Bilangan Asal
                </label>

                <select id="sistemInput" class="form-select form-select-lg">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10" selected>Desimal (Basis 10)</option>
                    <option value="16">Hexadesimal (Basis 16)</option>
                </select>
            </div>

            <!-- Sistem Bilangan Tujuan -->
            <div class="mb-4">
                <label for="sistemHasil" class="form-label fw-bold">
                    Konversi Ke
                </label>

                <select id="sistemHasil" class="form-select form-select-lg">
                    <option value="2">Biner (Basis 2)</option>
                    <option value="8">Oktal (Basis 8)</option>
                    <option value="10">Desimal (Basis 10)</option>
                    <option value="16">Hexadesimal (Basis 16)</option>
                </select>
            </div>

            <!-- Tombol -->
            <div class="d-flex gap-2">

                <button
                    type="button"
                    onclick="konversikan()"
                    class="btn btn-primary btn-lg w-100">
                    Konversi
                </button>

                <button
                    type="button"
                    onclick="resetForm()"
                    class="btn btn-secondary btn-lg">
                    Reset
                </button>

            </div>

            <hr class="my-4">

            <!-- Hasil -->
            <div class="hasil-box text-center">

                <div class="fw-bold fs-5 mb-2">
                    Hasil Konversi
                </div>

                <div id="hasil">
                    -
                </div>

                <div id="infoHasil">
                    Pilih sistem bilangan lalu tekan Konversi
                </div>

            </div>

        </div>

        <!-- Footer -->
        <div class="text-center text-secondary pb-3">
            Kalkulator Konversi Sistem Bilangan
        </div>

    </div>

</div
